name: Update monitor

on:
  schedule:
    # GitHub Actions는 UTC 기준. 카타르(UTC+3) 07:00 = 04:00 UTC / 15:30 = 12:30 UTC
    - cron: "0 4 * * *"
    - cron: "30 12 * * *"
  repository_dispatch:      # 외부 cron(cron-job.org 등)이 정시에 호출 → 브라우저·PC 없이도 발행
    types: [scheduled-run]
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      force_publish:
        description: "급감 검증을 무시하고 강제 발행"
        type: boolean
        default: false
      render_only:
        description: "재수집 없이 직전 캐시로 렌더만"
        type: boolean
        default: false

permissions:
  contents: write           # 생성한 index.html을 커밋/푸시하기 위함
  models: read              # GitHub Models(무료 AI 요약) 호출 권한

concurrency:
  group: update-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install feedparser

      - name: Generate index.html
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # 1순위: GitHub Models(내장 토큰, 키 발급 불필요)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # 2순위(선택)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 3순위(선택). 모두 없으면 헤드라인만
          RENDER_ONLY: ${{ (github.event_name == 'push' || inputs.render_only) && '1' || '0' }}   # 코드 푸시는 재수집 없이 캐시로 렌더만
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '0' }}                              # 급감 검증 우회(수동 실행 전용)
        run: python generate.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 실행된 브랜치(스케줄·repository_dispatch=main, 수동 실행=그 브랜치). detached HEAD에서도 정확.
          # 예전엔 'origin main' 하드코딩 + bare 'git push'라, 비-main 브랜치에서 돌리면
          # (수동 실행 시 detached HEAD) rebase 충돌·'not currently on a branch'로 항상 실패했다.
          BRANCH="${GITHUB_REF_NAME}"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: update $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              # 항상 '실행된 그 브랜치' 최신 위에 다시 얹고, 그 브랜치로 명시적으로 push.
              git pull --rebase --autostash origin "$BRANCH" || true
              if git push origin "HEAD:$BRANCH"; then echo "pushed on try $i ($BRANCH)"; exit 0; fi
              echo "[warn] push rejected, retry $i"; sleep $((5 * i))
            done
            echo "[error] push failed after 5 tries"; exit 1
          fi
